syntax = "proto3";

package akrostolion;

option go_package = "github.com/katastroma/akrostolion";

// LabelerService stamps Kubernetes manifests with platform labels.
service LabelerService {
  rpc LabelStream(stream LabelStreamRequest) returns (stream LabelStreamResponse);
  rpc Label(stream LabelRequest) returns (LabelResponse);
}

// Kubernetes manifest to label.
message LabelStreamRequest {
  bytes manifest = 1;
}

// Labeled Kubernetes manifest.
message LabelStreamResponse {
  bytes manifest = 1;
}

// Kubernetes manifest to label.
message LabelRequest {
  bytes manifest = 1;
}

// Labeled Kubernetes manifest.
message LabelResponse {}
